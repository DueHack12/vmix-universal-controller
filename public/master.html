<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vMix Universal Controller · Master</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .master { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; height: 100vh; padding: 14px; }
  .nav { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 1px solid transparent; background: transparent; font-size: 11px; }
  .nav button .i { font-size: 18px; line-height: 1; }
  .nav button.on { border-color: var(--blue); background: var(--blue-soft); }
  .main { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .lab { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
  textarea { background: var(--input); border: 1px solid var(--line2); border-radius: 8px; color: var(--text); padding: 8px 10px; font: inherit; width: 100%; min-height: 90px; }
  .gl { display: flex; flex-direction: column; gap: 6px; }
  .gl button { text-align: left; font-weight: 600; display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div class="master">
  <nav class="nav" id="nav"></nav>
  <main class="main">
    <div class="row"><a href="/" class="logo" style="text-decoration:none">UC</a><h1 class="grow" id="title">Master</h1><span id="conn" class="pill"></span><a class="pill" href="/control?layout=vertical" style="text-decoration:none">Control ▶</a></div>
    <div id="page" class="col" style="gap:14px"></div>
  </main>
</div>
<script src="/common.js"></script>
<script src="/master.js"></script>
</body>
</html>
