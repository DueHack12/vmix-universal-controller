name: Release

# Push a tag like v0.1.0-beta.1 to publish a release. Tags with a "-" become pre-releases.
# If a release for the tag already exists (e.g. made on the GitHub website), the zip is added
# to it and its title and notes are kept.
# Actions › Release › "Run workflow" builds and attaches the zip for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the zip for (e.g. v0.1.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Tag must match package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$TAG" ]; then echo "::error::package.json says $v but the tag is $TAG"; exit 1; fi
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm test
      - name: Build zip
        run: |
          mkdir -p dist
          zip="vmix-universal-controller-$TAG.zip"
          git archive --format=zip --prefix="vMix Universal Controller/" -o "dist/$zip" HEAD
          (cd dist && sha256sum "$zip" > "$zip.sha256")
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${TAG#v}" > dist/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: attaching the zip, keeping its title and notes"
            gh release upload "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" --clobber
          else
            pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" \
              --title "vMix Universal Controller $TAG" --notes-file dist/notes.md --verify-tag $pre
          fi
