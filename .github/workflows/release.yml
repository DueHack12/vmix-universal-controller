name: Release

# Push a tag like v0.1.0-beta.1 to publish a release. Tags with a "-" become pre-releases.
# If a release for the tag already exists (e.g. made on the GitHub website), the zip is added
# to it and its title and notes are kept.
# Actions › Release › "Run workflow" builds and attaches the zip for an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the zip for (e.g. v0.1.0-beta.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The tag decides the version. If package.json wasn't updated, the zip still gets the tag's
      # version (shown on the start page) and the run warns instead of failing.
      - name: Version from the tag
        run: |
          t="${TAG#v}"
          if ! [[ "$t" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag $TAG is not a version like v1.2.0 or v0.2.0-beta"; exit 1
          fi
          v="$(node -p "require('./package.json').version")"
          if [ "$v" != "$t" ]; then echo "::warning::package.json says $v but the tag is $TAG: the zip is labelled $t. Update package.json before the next release."; fi
          echo "VERSION=$t" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm test
      - name: Build zip
        run: |
          mkdir -p dist/stage
          zip="vmix-universal-controller-$TAG.zip"
          # git archive applies .gitattributes (CRLF for .bat/.txt, repo-only files left out)
          git archive --format=tar --prefix="vMix Universal Controller/" HEAD | tar -x -C dist/stage
          node -e "const f=process.argv[1],p=require(f);p.version=process.argv[2];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$PWD/dist/stage/vMix Universal Controller/package.json" "$VERSION"
          (cd dist/stage && zip -qrX "../$zip" "vMix Universal Controller")
          (cd dist && sha256sum "$zip" > "$zip.sha256")
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js "$VERSION" > dist/notes.md || echo "See [CHANGELOG.md](CHANGELOG.md)." > dist/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: attaching the zip, keeping its title and notes"
            gh release upload "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" --clobber
          else
            pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" "dist/$ZIP" "dist/$ZIP.sha256" \
              --title "vMix Universal Controller $TAG" --notes-file dist/notes.md --verify-tag $pre
          fi
