name: Release

# Push a tag like v0.1.0-beta.1 to publish a release. Tags with a "-" become pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Tag must match package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then echo "::error::package.json says $v but the tag is $GITHUB_REF_NAME"; exit 1; fi
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm test
      - name: Build zip
        run: |
          mkdir -p dist
          zip="vmix-universal-controller-$GITHUB_REF_NAME.zip"
          git archive --format=zip --prefix="vMix Universal Controller/" -o "dist/$zip" HEAD
          (cd dist && sha256sum "$zip" > "$zip.sha256")
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${GITHUB_REF_NAME#v}" > dist/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "dist/$ZIP" "dist/$ZIP.sha256" \
            --title "vMix Universal Controller $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag $pre
